name: course_planner
description: "Course Planner Flutter client - offline-first timetable, calendar, todo and sync (docs/openapi.yaml contract)."
publish_to: 'none'
version: 0.2.7+9

environment:
  sdk: ^3.12.2

dependencies:
  dio: ^5.11.1
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.0.0
  go_router: ^17.5.0
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.6
  build_runner: ^2.15.1

# The `sqlite3` package's build hook defaults to downloading a prebuilt
# libsqlite3 from GitHub releases. That is unavailable in this (offline)
# environment, so compile the vendored amalgamation instead — see
# third_party/sqlite3/README.md. `path` is relative to this package.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite3/sqlite3.c

flutter:
  uses-material-design: true
