# Production stack: PostgreSQL + the backend, with the backend published on
# loopback only so a reverse proxy (Caddy / nginx / cloudflared) terminates TLS.
#
#   cp env.example .env && ./scripts/gen-secrets.sh --write .env
#   docker compose up -d --build
#   docker compose logs -f server
#
# Compose loads .env from this directory automatically.
name: courseplanner

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Deliberately no ports: the database is reachable only from the compose
    # network (docs/deploy.md §10).

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PORT: "8080"
      # Traffic stays on the compose bridge, so no TLS to the database here.
      # For an external database use sslmode=require or verify-full instead.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      CONFIRMATION_TTL: ${CONFIRMATION_TTL:-10m}
    ports:
      # Loopback only: the TLS edge runs on this host and reaches the backend
      # over 127.0.0.1. Never publish 8080 to the internet.
      # SERVER_PORT is the *host* port the edge (Caddy/nginx/cloudflared) dials;
      # set it in .env when 8080 is already taken on the host. It must match the
      # port in the tunnel/reverse-proxy config.
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
