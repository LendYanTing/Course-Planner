# TLS-terminating reverse proxy in front of the backend (docs/deploy.md §6.3).
# Get the certificate with certbot, then adapt the two ssl_certificate paths:
#
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/courseplanner
#   sudo ln -s /etc/nginx/sites-available/courseplanner /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cp.example.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# The backend is designed to sit behind TLS termination; it must never be
# published directly on plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name cp.example.com;
    # certbot rewrites this block to redirect to https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cp.example.com;

    ssl_certificate     /etc/letsencrypt/live/cp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The backend accepts bodies up to 4 MiB for CSV import. nginx defaults to
    # 1m, which would reject those uploads before they reach the app with a 413.
    client_max_body_size 8m;

    # Never cache the API: responses carry user data and the MCP connect page
    # carries a one-time token.
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Host feeds the connect page's same-origin check; X-Forwarded-Proto
        # feeds the https:// endpoint address it renders. Without the latter the
        # page would tell users to connect to an http:// URL.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A slow MCP tool call can run up to the backend's own 90s ceiling.
        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Uncomment to close self-service registration (docs/deploy.md §10):
    # location = /api/v1/auth/register { return 404; }
}
